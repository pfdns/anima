name: Translate with Hy-MT2

on:
  workflow_dispatch:
    inputs:
      anilist_id:
        description: "AniList ID"
        required: true
        default: "113415"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hy-MT2 GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/hy-mt2.gguf
          key: hy-mt2-1.8b-q4-v1

      - name: Download Hy-MT2 GGUF
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "⬇️ Downloading Hy-MT2 1.8B Q4_K_M from Hugging Face..."
          mkdir -p models
          curl -L --fail --retry 3 -o models/hy-mt2.gguf \
            "https://huggingface.co/mradermacher/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B.Q4_K_M.gguf"
          ls -lh models/
          if [ ! -s models/hy-mt2.gguf ]; then
            echo "❌ Download failed or file is empty!"
            exit 1
          fi

      - name: Verify model
        run: |
          ls -lh models/
          file models/hy-mt2.gguf

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          pkill -f "ollama serve" || true
          sleep 2
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          curl -s http://localhost:11434/api/tags || echo "Ollama not ready"

      - name: Create Ollama model from Modelfile
        run: |
          ollama create hy-mt2 -f Modelfile
          ollama list

      - name: Build Glossary from AniList
        run: python3 glossary_builder.py ${{ github.event.inputs.anilist_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-${{ github.event.inputs.anilist_id }}
          path: glossaries/
          retention-days: 7
          if-no-files-found: warn

      - name: Show Ollama logs on failure
        if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
          echo ""
          df -h
