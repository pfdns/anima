name: Auto Translate Episode (Qwen 2.5)

on:
  workflow_dispatch:
    inputs:
      anilist_id:
        description: "AniList ID"
        required: true
        default: "113415"
      episode:
        description: "Episode number"
        required: true
        default: "6"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Cache Qwen 2.5 GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-7b.gguf
          key: qwen2.5-7b-q4-v1

      - name: Download Qwen 2.5 GGUF
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "⬇️ Downloading Qwen 2.5 7B Q4_K_M..."
          mkdir -p models
          wget --continue --tries=3 --timeout=120 \
            "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf" \
            -O models/qwen2.5-7b.gguf
          ls -lh models/
          if [ ! -s models/qwen2.5-7b.gguf ]; then
            echo "❌ Download failed or file is empty!"
            exit 1
          fi

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          pkill -f "ollama serve" || true
          sleep 2
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          curl -s http://localhost:11434/api/tags || echo "Ollama not ready"

      - name: Create Ollama model from Modelfile
        run: |
          ollama create qwen2.5-7b -f Modelfile
          ollama list

      - name: Run auto translation
        run: |
          python3 auto_translate.py ${{ github.event.inputs.anilist_id }} \
            --episode ${{ github.event.inputs.episode }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-${{ github.event.inputs.anilist_id }}-ep${{ github.event.inputs.episode }}
          path: |
            output/
            subtitles/
            glossaries/
          retention-days: 7
          if-no-files-found: warn

      - name: Show Ollama logs on failure
        if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
