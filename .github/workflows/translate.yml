name: Auto Translate Episode

on:
  workflow_dispatch:
    inputs:
      anilist_id:
        description: "AniList ID"
        required: true
        default: "113415"
      episode:
        description: "Episode number"
        required: true
        default: "6"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          curl -s http://localhost:11434/api/tags || echo "not ready"

      - name: Cache Hy-MT2 GGUF
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/
          key: hy-mt2-1.8b-q4-v2

      - name: Download Hy-MT2 GGUF
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Hy-MT2 1.8B Q4_K_M..."
          mkdir -p models
          wget -q --show-progress "https://huggingface.co/mradermacher/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B.Q4_K_M.gguf" -O models/hy-mt2.gguf
          ls -lh models/

      - name: Register Hy-MT2 with Ollama
        run: |
          cat > Modelfile << 'EOF'
          FROM ./models/hy-mt2.gguf
          PARAMETER temperature 0.0
          PARAMETER top_p 0.1
          PARAMETER top_k 1
          PARAMETER repeat_penalty 1.3
          PARAMETER repeat_last_n 64
          PARAMETER num_ctx 512
          PARAMETER stop "\n\n"
          EOF
          ollama create hy-mt2 -f Modelfile
          ollama list

      - name: Run auto translation
        run: |
          python3 auto_translate.py ${{ github.event.inputs.anilist_id }} --episode ${{ github.event.inputs.episode }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-${{ github.event.inputs.anilist_id }}-ep${{ github.event.inputs.episode }}
          path: |
            output/
            subtitles/
            glossaries/
          retention-days: 7
          if-no-files-found: warn

      - name: Show Ollama logs on failure
        if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
