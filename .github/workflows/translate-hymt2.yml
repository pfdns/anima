name: Translate with Hy-MT2 Local

on:
  workflow_dispatch:
    inputs:
      anilist_id:
        description: "AniList ID"
        required: true
        default: "113415"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hy-MT2 GGUF Model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/hy-mt2.gguf
          key: hy-mt2-1.8b-q4-v1

      - name: Download Hy-MT2 GGUF
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Hy-MT2 1.8B Q4_K_M..."
          mkdir -p models
          wget -q --show-progress "https://huggingface.co/mradermacher/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B.Q4_K_M.gguf" -O models/hy-mt2.gguf
          ls -lh models/

      - name: Verify model
        run: |
          ls -lh models/
          file models/hy-mt2.gguf

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          curl -s http://localhost:11434/api/tags || echo "Ollama not ready"

      - name: Register Hy-MT2 with Ollama
        run: |
          printf 'FROM ./models/hy-mt2.gguf\nPARAMETER temperature 0.3\nPARAMETER top_p 0.6\nPARAMETER top_k 20\nPARAMETER repetition_penalty 1.05\nPARAMETER num_predict 4096\n' > Modelfile
          cat Modelfile
          ollama create hy-mt2 -f Modelfile
          ollama list

      - name: Test simple translation
        run: |
          python3 -c "
          import requests
          r = requests.post('http://localhost:11434/api/generate', json={
              'model': 'hy-mt2',
              'prompt': 'Translate to Persian: Hello world, how are you?',
              'stream': False,
              'options': {'temperature': 0.3, 'num_predict': 256}
          }, timeout=600)
          print('=' * 60)
          print('Result:', r.json().get('response', 'NO RESPONSE'))
          print('=' * 60)
          "

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Build Glossary from AniList
        run: python3 glossary_builder.py ${{ github.event.inputs.anilist_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-${{ github.event.inputs.anilist_id }}
          path: glossaries/
          retention-days: 7
          if-no-files-found: warn

      - name: Show Ollama logs on failure
        if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
          echo ""
          echo "=== Disk usage ==="
          df -h
          du -sh ~/.ollama || true
