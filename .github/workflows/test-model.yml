name: Test Hy-MT2 Simple

on:
  workflow_dispatch:

jobs:
  test-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10

      - name: Cache model
        id: cache
        uses: actions/cache@v4
        with:
          path: models/
          key: hy-mt2-1.8b-q4-v2

      - name: Download GGUF
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          wget -q --show-progress "https://huggingface.co/mradermacher/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B.Q4_K_M.gguf" -O models/hy-mt2.gguf
          ls -lh models/

      - name: Register with Ollama (optimized)
        run: |
          cat > Modelfile << 'EOF'
          FROM ./models/hy-mt2.gguf
          PARAMETER temperature 0.0
          PARAMETER top_p 0.1
          PARAMETER top_k 1
          PARAMETER repeat_penalty 1.3
          PARAMETER repeat_last_n 64
          PARAMETER num_ctx 512
          PARAMETER stop "\n\n"
          EOF
          ollama create hy-mt2 -f Modelfile
          ollama list

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Test with different prompts
        run: |
          python3 << 'PYEOF'
          import requests
          import re

          def translate(text, prompt_template):
              prompt = prompt_template.format(text=text)
              r = requests.post('http://localhost:11434/api/generate', json={
                  'model': 'hy-mt2',
                  'prompt': prompt,
                  'stream': False,
                  'options': {
                      'temperature': 0.0,
                      'top_p': 0.1,
                      'top_k': 1,
                      'repeat_penalty': 1.3,
                      'num_predict': 200,
                      'num_ctx': 512,
                  }
              }, timeout=180)
              result = r.json().get('response', '')
              # پاکسازی
              result = re.sub(r'\n\n.*', '', result, flags=re.DOTALL)
              result = result.strip()
              return result

          test_cases = [
              "Hello, how are you today?",
              "Don't look inside me without permission. I hate it.",
              "Cursed Energy",
              "Domain Expansion",
              "I want to become stronger.",
          ]

          # پرامپت‌های مختلف
          prompts = {
              "A": "Translate to Persian:\n{text}",
              "B": "Persian translation: {text}\nPersian:",
              "C": "Translate this to Farsi: {text}\nFarsi:",
              "D": "{text}\n\nPersian:",
          }

          print("=" * 60)
          print("TESTING DIFFERENT PROMPTS")
          print("=" * 60)

          for pname, ptmpl in prompts.items():
              print(f"\n--- Prompt {pname} ---")
              for text in test_cases:
                  result = translate(text, ptmpl)
                  print(f"EN: {text}")
                  print(f"FA: {result}")
                  print()

          PYEOF

      - name: Show Ollama logs
        if: always()
        run: cat /tmp/ollama.log | tail -20
