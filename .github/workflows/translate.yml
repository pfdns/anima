name: Translate with Hy-MT2

on:
  workflow_dispatch:
    inputs:
      anilist_id:
        description: "AniList ID"
        required: true
        default: "113415"

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Kill any existing Ollama process
        run: |
          pkill -f "ollama serve" || true
          sleep 2

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 10
          curl -s http://localhost:11434/api/tags || echo "Ollama not ready"

      - name: Create Ollama model from Modelfile
        run: |
          ls -lh models/
          ollama create hy-mt2 -f Modelfile
          ollama list

      - name: Build Glossary from AniList
        run: python3 glossary_builder.py ${{ github.event.inputs.anilist_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-${{ github.event.inputs.anilist_id }}
          path: glossaries/
          retention-days: 7
          if-no-files-found: warn

      - name: Show Ollama logs on failure
        if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
          echo ""
          df -h
