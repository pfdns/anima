name: Test Hy-MT2 Translation

on:
  workflow_dispatch:

jobs:
  test-hymt2:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          ollama serve &
          sleep 10

      - name: Download Hy-MT2 1.8B model
        run: |
          echo "📥 Downloading Hy-MT2 1.8B..."
          time ollama pull hy-mt2:1.8b
          echo "✅ Model downloaded"
          ollama list

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Test simple translation
        run: |
          python3 -c "
          import requests
          url = 'http://localhost:11434/api/generate'
          payload = {
              'model': 'hy-mt2:1.8b',
              'prompt': 'Translate to Persian: Don\\'t look inside me without permission. I hate it...',
              'stream': False,
              'options': {'temperature': 0.3, 'num_predict': 512}
          }
          print('🌐 Sending request...')
          r = requests.post(url, json=payload, timeout=300)
          r.raise_for_status()
          result = r.json()
          print()
          print('='*60)
          print('  Result:')
          print('='*60)
          print(result.get('response', 'NO RESPONSE'))
          print('='*60)
          "

      - name: Test glossary builder
        run: |
          python3 glossary_builder.py 113415
        env:
          PYTHONIOENCODING: utf-8

      - name: Test glossary translation
        run: |
          python3 -c "
          import requests, json, os
          # بارگذاری glossary
          with open('glossaries/113415_en.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          # ساخت متن برای ترجمه
          terms = []
          for t in data.get('tags', [])[:10]:
              terms.append(f\"{t['name']}: {t['description'][:100]}\")

          text = '\n'.join(terms)

          url = 'http://localhost:11434/api/generate'
          prompt = f'''Translate these anime terms to Persian.
This is for the anime Jujutsu Kaisen.

{text}

Output only the translations, one per line.'''

          payload = {
              'model': 'hy-mt2:1.8b',
              'prompt': prompt,
              'stream': False,
              'options': {'temperature': 0.3, 'num_predict': 2048}
          }

          print('🌐 Translating glossary...')
          r = requests.post(url, json=payload, timeout=300)
          r.raise_for_status()
          result = r.json()
          print()
          print('='*60)
          print('  Glossary translation:')
          print('='*60)
          print(result.get('response', 'NO RESPONSE'))
          print('='*60)
          "

      - name: Show disk usage
        if: always()
        run: |
          df -h
          du -sh ~/.ollama || true
